name: Continuous Delivery

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version and image name
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          IMAGE=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Building $IMAGE:$VERSION"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }} \
            -t ${{ steps.version.outputs.image }}:latest \
            .

      - name: Push Docker images
        run: |
          docker push ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
          docker push ${{ steps.version.outputs.image }}:latest

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to staging
        run: |
          docker pull ${{ needs.build.outputs.image }}:${{ needs.build.outputs.version }}
          docker stop mlops-api || true
          docker rm mlops-api || true
          docker run -d \
            --name mlops-api \
            -p 5000:5000 \
            -e APP_ENV=staging \
            ${{ needs.build.outputs.image }}:${{ needs.build.outputs.version }}

      - name: Smoke test
        run: |
          sleep 5
          curl --fail http://localhost:5000/health

  deploy-production:
    needs:
      - build
      - deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to production
        run: |
          docker pull ${{ needs.build.outputs.image }}:${{ needs.build.outputs.version }}
          docker stop mlops-api || true
          docker rm mlops-api || true
          docker run -d \
            --name mlops-api \
            -p 5000:5000 \
            -e APP_ENV=production \
            ${{ needs.build.outputs.image }}:${{ needs.build.outputs.version }}

      - name: Verify production
        run: |
          sleep 5
          curl --fail http://localhost:5000/health
